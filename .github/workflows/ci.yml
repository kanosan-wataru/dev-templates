name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'dotfiles/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  zsh-syntax:
    name: Zsh Syntax Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Verify Zsh is available
        run: zsh --version
      - name: Run zsh -n
        run: |
          status=0
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            if zsh -n "$f"; then
              echo "OK: $f"
            else
              echo "::error file=$f::Syntax error in $f"
              status=1
            fi
            echo "::endgroup::"
          done < <(find dotfiles -type f \( -name '*.zsh' -o -name '*.sh' -o -name '.zshrc' \) ! -name '.p10k.zsh' -print0)
          exit $status

  dry-run:
    name: Setup Dry Run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Verify Zsh is available
        run: zsh --version
      - name: Run setup.sh --all --dry-run
        run: zsh dotfiles/setup.sh --all --dry-run

  shell-format:
    name: Shell Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.8.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Check shell format
        run: |
          status=0
          # .zsh/*.zsh and modules/*.sh をチェック（Zsh特有構文を含む .zshrc と setup.sh は除外）
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            if shfmt -d "$f"; then
              echo "OK: $f"
            else
              echo "::error file=$f::Format check failed for $f"
              status=1
            fi
            echo "::endgroup::"
          done < <(find dotfiles/.zsh dotfiles/modules -type f \( -name '*.zsh' -o -name '*.sh' \) ! -name '.p10k.zsh' -print0)
          exit $status

  bats-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: bats dotfiles/tests/*.bats
